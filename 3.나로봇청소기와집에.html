<html>


<style>
    html, body {
    overflow: hidden;
    margin: 0px;
    user-select: none;
    width: 100%;
    height: 100%;
   
    padding: 0;

}

body {
    background-color: rgb(154, 147, 118);
    position: relative;        
  width: 100vw;
  height: 100vh;
  overflow: hidden;

    margin: 0px;
    user-select: none;


    display: flex;
    justify-content: center;
    align-items: center;


  
}

#background {

max-width: 100%;   
max-height: 100%;     
height: 100%;
width: 100%;
position: absolute; 
object-fit: cover;
z-index: 0;

}

#following {

position: fixed; 
width: 10%;
height: auto;
transform: translate(-50%, -50%);
z-index: 0; 

}


#gamearea {
    position:relative;
    width: 100%;
    height: 100%;
}

#target {
    position: absolute;
    width: 30%;
    
    transition: left 0.3s ease-out, top 0.3s ease-out;
    z-index: 1;
}




#start {
    max-width: 100%;   
    max-height: 100%;     
    height: auto;
    position: absolute; /* 절대 위치 설정 */

    width: 80%;
    object-fit: cover;
    z-index: 50;
}

#instruction1{
    z-index:2;
    
    display: none;
    position: fixed; 
    left: 50%;
    top: 50%;
    width:70%;
    transform: translate(-50%, -50%)
}

#timer{
    background-color: rgb(224, 145, 108);
    padding: 20px;
    border-radius: 30px;

    font-size: 30px;
    color: bisque;
    font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

    position: fixed; 
    left: 50%;
    top: 5%;
  
  transform: translate(-50%, -50%); 

    z-index: 20;
}


.ending {
position: absolute;
width: 100%;
display: none;
}

#homebutton {
    position:absolute;
   
    top: 100%;
    left: 50%;
    
    transform: translate(-50%, -50%); 


    display: block;

}


#homebutton {
    position:absolute;
   
    top: 80%;
    left: 60%;
    

    transform: translate(-50%, -50%); 


    display: block;
    z-index: 50;

}

#homebutton img {
    width: 50%;

}



</style>



<body>

    <img id="background" src="background3.png">

    <div id="gamearea"></div>
    <img id="target" src="target.png">
    <img id="following" src="dog.png">

    <div id="timer">
        남은시간: <span id="timeleft">15.00</span>초
        성공시간: <span id="successtime">0.00</span>초
    </div>

    <img class="ending" id="success" src="성공.png">
    <img class="ending" id="fail" src="실패.png">


    <div id="result"></div>



    <img id="start" src="title3.png">
    <img id="instruction1" src="instruction3.png">


    <div id="homebutton">
    <a href="index.html">
        <img src="thirdhome.png">
    </a>





</div>

    <script src="3.js"></script>
</body>


</html>
